<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Feedback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            color: #2c3e50;
        }

        table {
            width: 85%;
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            background-color: #2c3e50;
            color: white;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e8f0fe;
        }

        .back-btn {
            display: inline-block;
            margin: 30px auto 0;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
        }

        .back-btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <h1>User Feedback</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Experience</th>
                <th>Suggestion</th>
            </tr>
        </thead>
        <tbody>
            {% for fb in feedback %}
            <tr>
                <td>{{ fb.id }}</td>
                <td>{{ fb.experience }}</td>
                <td>{{ fb.suggestion }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div style="text-align: center;">
        <a href="{{ url_for('admin_dashboard') }}" class="back-btn">Back to Home</a>
    </div>

</body>
</html>
